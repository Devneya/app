name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=unit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: unit-results.xml
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          VITE_USE_MOCKS: "true"
          VITE_API_BASE_URL: https://api.devneya.com
          VITE_GOTRUE_ANON_KEY: mock-anon-key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build staging bundle
        run: |
          set -euo pipefail
          npm run build
          printf '{"environment":"staging","source":"%s"}\n' "$GITHUB_SHA" > dist/version.json
          tar -czf "devneya-app-staging-${GITHUB_SHA}.tar.gz" -C dist .
        env:
          VITE_USE_MOCKS: "false"
          VITE_API_BASE_URL: https://api.stage.devneya.com
          VITE_GOTRUE_ANON_KEY: ${{ vars.VITE_GOTRUE_STAGE_ANON_KEY }}
      - name: Build production bundle
        run: |
          set -euo pipefail
          npm run build
          printf '{"environment":"production","source":"%s"}\n' "$GITHUB_SHA" > dist/version.json
          tar -czf "devneya-app-production-${GITHUB_SHA}.tar.gz" -C dist .
        env:
          VITE_USE_MOCKS: "false"
          VITE_API_BASE_URL: https://api.devneya.com
          VITE_GOTRUE_ANON_KEY: ${{ secrets.VITE_GOTRUE_ANON_KEY }}
      - name: Publish immutable app release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace its assets." >&2
            exit 1
          fi
          gh release create "$tag" \
            "devneya-app-staging-${GITHUB_SHA}.tar.gz" \
            "devneya-app-production-${GITHUB_SHA}.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "App bundles built from main commit $GITHUB_SHA. Deploy explicitly by selecting this tag."
