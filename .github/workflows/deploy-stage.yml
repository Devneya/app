name: Deploy selected release to staging

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact app release tag, for example sha-<40-character commit>
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and validate selected release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^sha-([0-9a-f]{40})$ ]]
          source_sha="${BASH_REMATCH[1]}"
          git fetch origin main --tags
          git merge-base --is-ancestor "$source_sha" origin/main
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$source_sha"
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/dist"
          gh release download "$RELEASE_TAG" \
            --pattern "devneya-app-staging-${source_sha}.tar.gz" \
            --dir "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/release/devneya-app-staging-${source_sha}.tar.gz" \
            -C "$RUNNER_TEMP/dist"
          jq -e --arg sha "$source_sha" '.source == $sha and .environment == "staging"' \
            "$RUNNER_TEMP/dist/version.json" >/dev/null
      - name: Upload selected bundle to the staging Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_WRITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.2 pages deploy "$RUNNER_TEMP/dist" \
            --project-name devneya-app-stage --branch main
      - name: Verify staging serves the selected release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#sha-}"
          for attempt in {1..12}; do
            actual="$(curl --fail --silent --show-error --user-agent 'Devneya-stage-release-check/1' https://app.stage.devneya.com/version.json || true)"
            if [[ "$actual" == *"\"source\":\"$expected\""* && "$actual" == *'"environment":"staging"'* ]]; then
              exit 0
            fi
            sleep 5
          done
          printf 'Staging did not serve selected release %s; last response: %s\n' "$RELEASE_TAG" "$actual" >&2
          exit 1
