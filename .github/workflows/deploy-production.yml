name: Deploy selected release to production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact app release tag, for example sha-<40-character commit>
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://app.devneya.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download and validate selected release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^sha-([0-9a-f]{40})$ ]]
          source_sha="${BASH_REMATCH[1]}"
          git fetch origin main --tags
          git merge-base --is-ancestor "$source_sha" origin/main
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$source_sha"
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/dist"
          gh release download "$RELEASE_TAG" \
            --pattern "devneya-app-production-${source_sha}.tar.gz" \
            --dir "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/release/devneya-app-production-${source_sha}.tar.gz" \
            -C "$RUNNER_TEMP/dist"
          jq -e --arg sha "$source_sha" '.source == $sha and .environment == "production"' \
            "$RUNNER_TEMP/dist/version.json" >/dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify production serves the selected release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#sha-}"
          actual="$(curl --fail --silent --show-error --user-agent 'Devneya-production-release-check/1' https://app.devneya.com/version.json)"
          [[ "$actual" == *"\"source\":\"$expected\""* && "$actual" == *'"environment":"production"'* ]]
